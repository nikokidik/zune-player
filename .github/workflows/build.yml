
name: Build Zune APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract project
        run: |
          mkdir -p extracted
          unzip -q zune-android.zip -d extracted

          PROJECT_DIR="$(dirname "$(find extracted -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)")"

          if [ -z "$PROJECT_DIR" ]; then
            echo "Gradle project not found!"
            find extracted -maxdepth 4 -type f
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Found project: $PROJECT_DIR"

      - name: Build Release APK
        run: gradle assembleRelease --no-daemon
        working-directory: ${{ env.PROJECT_DIR }}

      - name: Collect APK
        run: |
          APK="$(find "$PROJECT_DIR" -type f -path '*/build/outputs/apk/release/*.apk' -print -quit)"

          if [ -z "$APK" ]; then
            echo "Release APK not found!"
            find "$PROJECT_DIR" -type f
            exit 1
          fi

          mkdir -p release
          cp "$APK" release/ZunePlayer.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ZunePlayer-release
          path: release/ZunePlayer.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" \
            release/ZunePlayer.apk \
            --title "Zune build ${{ github.run_number }}" \
            --notes "Zune Android release build"
