
      - name: Build APK
        run: |
          PROJECT_DIR=$(dirname "$(find extracted \( -name settings.gradle -o -name settings.gradle.kts \) | head -n 1)")

          if [ -z "$PROJECT_DIR" ] || [ "$PROJECT_DIR" = "extracted" ]; then
            echo "Gradle project not found!"
            exit 1
          fi

          cd "$PROJECT_DIR"
          gradle assembleRelease --no-daemon

      - name: Find APK
        run: |
          APK=$(find extracted -path '*/build/outputs/apk/release/*.apk' -type f | head -n 1)

          if [ -z "$APK" ]; then
            echo "Release APK not found!"
            find extracted -type f
            exit 1
          fi

          mkdir -p release
          cp "$APK" release/ZunePlayer.apk

      - name: Publish APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" \
            release/ZunePlayer.apk \
            --title "Zune release ${{ github.run_number }}" \
            --notes "Zune Android release build"
